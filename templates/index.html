<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home page</title>
  <style>
    :root {
      --bg: #0f1420;
      --card: #1f2638;
      --text: #e8eefc;
      --border: rgba(255, 255, 255, 0.12);
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1c263f 0%, var(--bg) 80%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 0 1.5rem;
      overflow: hidden;
    }

    .card {
      max-height: calc(100vh - 2rem);
      overflow: auto;
    }

    .card {
      padding: 2rem;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.18));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Home page</h1>
  </main>
</body>

</html>
