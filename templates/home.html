<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction of Data</title>
  <style>
    :root {
      --bg: #0f1420;
      --card: #1f2638;
      --card-2: #222b40;
      --text: #e8eefc;
      --muted: #a3b0d0;
      --accent: #6c8cff;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1c263f 0%, var(--bg) 70%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 0 1.5rem;
      overflow: hidden;
    }

    .card {
      width: min(520px, 100%);
      max-height: calc(100vh - 2rem);
      padding: 1.75rem 1.75rem 1.75rem;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.2));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      overflow: auto;
    }

    h1 {
      margin: 0 0 1rem 0;
      font-size: 1.6rem;
      letter-spacing: 0.5px;
      color: var(--text);
      text-align: center;
    }

    form {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 740px) {
      form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      form h1 {
        grid-column: 1 / -1;
      }

      form .mb-3:nth-child(n + 2) {
        width: 100%;
      }

      form .mb-3:last-of-type {
        grid-column: 1 / -1;
      }
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input,
    select {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border 150ms ease, box-shadow 150ms ease;
    }

    option {
      color: var(--text);
      background: rgba(15, 20, 32, 0.95);
    }

    .placeholder {
      color: var(--muted);
    }

    input:focus,
    select:focus {
      border-color: rgba(108, 140, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.23);
    }

    input[type="submit"] {
      cursor: pointer;
      background: linear-gradient(120deg, rgba(108, 140, 255, 0.9), rgba(81, 195, 255, 0.8));
      border: none;
      color: #0b1223;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    input[type="submit"]:hover {
      filter: brightness(1.05);
    }

    .result {
      margin-top: 1.5rem;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Student Exam Performance Indicator</h1>

    <form action="{{ url_for('predict_datapoint')}}" method="post">
      <h1>
        <legend>Student Exam Performance Prediction</legend>
      </h1>
      <div class="mb-3">
        <label class="form-label">Gender</label>
        <select class="form-control" name="gender" placeholder="Enter you Gender" required>
          <option class="placeholder" selected disabled value="">Select your Gender</option>
          <option value="male">
            Male
          </option>
          <option value="female">
            Female
          </option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Race or Ethnicity</label>
        <select class="form-control" name="ethnicity" placeholder="Enter you ethnicity" required>
          <option class="placeholder" selected disabled value="">Select Ethnicity</option>
          <option value="group A">
            Group A
          </option>
          <option value="group B">
            Group B
          </option>
          <option value="group C">
            Group C
          </option>
          <option value="group D">
            Group D
          </option>
          <option value="group E">
            Group E
          </option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Parental Level of Education</label>
        <select class="form-control" name="parental_level_of_education" placeholder="Enter you Parent Education"
          required>
          <option class="placeholder" selected disabled value="">Select Parent Education</option>
          <option value="associate's degree">
            associate's degree
          </option>
          <option value="bachelor's degree">
            bachelor's degree
          </option>
          <option value="high school">
            high school
          </option>
          <option value="master's degree">
            master's degree
          </option>
          <option value="some college">
            some college
          </option>
          <option value="some high school">
            some high school
          </option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Lunch Type</label>
        <select class="form-control" name="lunch" placeholder="Enter you Lunch" required>
          <option class="placeholder" selected disabled value="">Select Lunch Type</option>
          <option value="free/reduced">
            free/reduced
          </option>
          <option value="standard">
            standard
          </option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Test preparation Course</label>
        <select class="form-control" name="test_preparation_course" placeholder="Enter you Course" required>
          <option class="placeholder" selected disabled value="">Select Test_course</option>
          <option value="none">
            None
          </option>
          <option value="completed">
            Completed
          </option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Writing Score out of 100</label>
        <input class="form-control" type="number" name="reading_score" placeholder="Enter your Reading score" min='0'
          max='100' />
      </div>
      <div class="mb-3">
        <label class="form-label">Reading Score out of 100</label>
        <input class="form-control" type="number" name="writing_score" placeholder="Enter your Reading Score" min='0'
          max='100' />
      </div>
      <div class="mb-3">
        <input class="btn btn-primary" type="submit" value="Predict your Maths Score" required />
      </div>
    </form>
    <div class="result">
      <h2>
        THE prediction is {{results}}
      </h2>
    </div>
  </main>
</body>

</html>
